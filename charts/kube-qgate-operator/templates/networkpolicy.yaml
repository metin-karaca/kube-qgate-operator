{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-qgate-operator.fullname" . }}-allow-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-qgate-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kube-qgate-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsFrom | nindent 14 }}
      ports:
        - port: 8443
          protocol: TCP
    {{- end }}
    {{- if .Values.webhook.enabled }}
    # Admission requests arrive on 9443. Omitting this rule — or narrowing it to a
    # namespaceSelector — breaks admission wherever the API server's source address is not a Pod
    # IP, which with failurePolicy=Fail rejects every matching Deployment in the cluster.
    - ports:
        - port: 9443
          protocol: TCP
      {{- with .Values.networkPolicy.webhookFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    # The kubelet probes /healthz and /readyz from the node, whose address is not a Pod IP either.
    - ports:
        - port: 8081
          protocol: TCP
{{- end }}
