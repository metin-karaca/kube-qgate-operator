{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "kube-qgate-operator.fullname" . }}-validating-webhook-configuration
  labels:
    {{- include "kube-qgate-operator.labels" . | nindent 4 }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kube-qgate-operator.fullname" . }}-serving-cert
  {{- end }}
webhooks:
  - name: vdeployment.qgate.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    # The release namespace is always excluded: with failurePolicy=Fail a crashed operator would
    # otherwise reject the very Deployment update needed to bring it back up.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - {{ .Release.Namespace }}
            {{- range .Values.webhook.excludedNamespaces }}
            - {{ . }}
            {{- end }}
        {{- with .Values.webhook.includedNamespaces }}
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- toYaml . | nindent 12 }}
        {{- end }}
    clientConfig:
      service:
        name: {{ include "kube-qgate-operator.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-apps-v1-deployment
    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
{{- end }}
