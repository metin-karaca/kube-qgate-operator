{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kube-qgate-operator.fullname" . }}-controller-manager-metrics-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-qgate-operator.selectorLabels" . | nindent 4 }}
spec:
  endpoints:
    - path: /metrics
      port: https
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        {{- if .Values.certManager.enabled }}
        serverName: {{ include "kube-qgate-operator.fullname" . }}-controller-manager-metrics-service.{{ .Release.Namespace }}.svc
        ca:
          secret:
            name: {{ include "kube-qgate-operator.fullname" . }}-metrics-server-cert
            key: ca.crt
        {{- else }}
        insecureSkipVerify: true
        {{- end }}
  selector:
    matchLabels:
      {{- include "kube-qgate-operator.selectorLabels" . | nindent 6 }}
{{- end }}
